[workspace]
members = ["jev-repl", "typesafe-derive"]

[package]
name = "typesafe-ai-sdk"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Rust client for the TypeSafe AI System One API (Noul, Choice and Score questions)"
license = "MIT"
repository = "https://github.com/aoprisan/typesafe-ai-rust-sdk"
documentation = "https://docs.rs/typesafe-ai-sdk"
keywords = ["typesafe", "ai", "classification", "sdk", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"

[lib]
name = "typesafe"

[features]
default = []
## Synchronous client backed by a private current-thread Tokio runtime.
blocking = ["tokio/rt"]
## `ClientBuilder::http_client`, which takes a `reqwest::Client`. Off by default because that
## signature tracks reqwest's major version; the rest of the public API only uses `http` types.
reqwest-client = []
## `#[derive(Rubric)]` and `#[derive(RubricChoice)]`, from the `typesafe-derive` proc-macro crate.
derive = ["dep:typesafe-derive"]

[dependencies]
bytes = "1.12.1"
http = "1.3.1"
httpdate = "1.0.3"
indexmap = { version = "2.14.2", features = ["serde"] }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time"] }
tracing = "0.1.44"
typesafe-derive = { path = "typesafe-derive", version = "0.2.0", optional = true }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[[example]]
name = "triage"

[[example]]
name = "blocking"
required-features = ["blocking"]

[[example]]
name = "derive"
required-features = ["derive"]

[[example]]
name = "custom_client"
required-features = ["reqwest-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
