name: release
# Three crates, three tag prefixes: `v0.1.0` publishes the library, `jev-v0.1.0` the REPL and
# `derive-v0.1.0` the library's proc macros. Each depends on a published version of the one before
# it — derive, then library, then REPL — so tag in that order when more than one changes.
on:
  push:
    tags: ["v*", "jev-v*", "derive-v*"]
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to publish
        type: choice
        options: [typesafe-ai-sdk, jev-repl, typesafe-derive]
        default: typesafe-ai-sdk
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pick the crate from the tag
        id: pick
        run: |
          case "$GITHUB_REF_NAME" in
            jev-v*) crate=jev-repl; tag="${GITHUB_REF_NAME#jev-v}" ;;
            derive-v*) crate=typesafe-derive; tag="${GITHUB_REF_NAME#derive-v}" ;;
            v*)     crate=typesafe-ai-sdk; tag="${GITHUB_REF_NAME#v}" ;;
            *)      crate="${{ inputs.crate }}"; tag="" ;;
          esac
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the manifest version
        if: ${{ steps.pick.outputs.tag != '' }}
        run: |
          crate="${{ steps.pick.outputs.crate }}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
          if [ "${{ steps.pick.outputs.tag }}" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match $crate version $manifest" >&2
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo test -p jev-repl
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p ${{ steps.pick.outputs.crate }} --locked
