[package]
name = "jev-repl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Interactive TUI playground for learning the jev model (TypeSafe AI System One)"
license = "MIT"
repository = "https://github.com/aoprisan/typesafe-ai-rust-sdk"
publish = false

[lib]
name = "jev_repl"
path = "src/lib.rs"

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
typesafe-ai-sdk = { path = "..", version = "0.1.0" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
